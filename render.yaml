services:
  - type: web
    name: cybermfukoni-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cybermfukoni-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GNEWS_API_KEY
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
    rootDir: backend

databases:
  - name: cybermfukoni-db
    databaseName: cybermfukoni
    user: cybermfukoni_user
